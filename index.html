<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareBridge Demo – Care Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDMincho:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  color-scheme:light;
  /* CareBridge tokens — indigo (藍) of care uniforms, vermilion (朱) of hanko */
  --ai:#233A66; --ai-2:#E8EDF5; --ai-3:#3A5486;
  --bg:#F2F4F7; --panel:#fff; --ink:#22262E; --muted:#5E6673;
  --line:#D3D9E1; --rule:#C3CAD4; --head:#E6EAF0; --band:#F4F6F9;
  --shu:#C23B22; --shu-bg:#FBECE8; --warn:#9A620F; --warn-bg:#FBF3E4; --ok:#2F6B45; --ok-bg:#E7F1EA;
  --brand:var(--ai); --brand-2:var(--ai-2); --bad:var(--shu); --bad-bg:var(--shu-bg);
  --sans:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif; --mincho:"BIZ UDMincho","Yu Mincho",serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.svg-inline--fa{vertical-align:-.125em}
/* top bar */
header.top{display:flex;align-items:center;gap:16px;height:52px;padding-right:18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6}
.brand{display:flex;align-items:center;gap:11px;width:220px;height:100%;padding:0 20px;background:var(--ai);color:#fff;flex-shrink:0}
.brand .svg-inline--fa{font-size:20px;color:#fff}
.brand b{display:block;font-size:16px;line-height:1.1}
.brand small{display:block;font-size:11px;color:#B8C4DA}
.facility{font-size:13px;color:var(--muted);white-space:nowrap}
.facility b{color:var(--ink);margin-right:10px}
.demo{font-size:11px;border:1px solid var(--rule);border-radius:2px;padding:1px 6px;color:var(--muted);margin-left:10px}
header .sp{flex:1}
.shift{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 12px;border:1px solid var(--line);border-radius:3px;background:var(--band);white-space:nowrap}
.shift .svg-inline--fa{color:var(--ai)}
.shift b{font-size:15px}
.lang{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.lang button{background:#fff;color:var(--ink);border:0;padding:6px 11px;cursor:pointer;font:inherit;font-size:12px}
.lang button.on{background:var(--ai);color:#fff;font-weight:700}
/* binder spine navigation */
.wrap{display:flex;min-height:calc(100vh - 52px)}
nav{width:220px;background:var(--ai);padding:6px 0 24px;flex-shrink:0;position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto}
nav .grp{font-size:11.5px;color:#93A5C4;padding:16px 20px 4px}
nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:8px 17px;cursor:pointer;font:inherit;font-size:13.5px;color:#E3E8F1}
nav button:hover{background:rgba(255,255,255,.07)}
nav button.on{background:var(--bg);color:var(--ai);border-left-color:var(--shu);font-weight:700}
nav .ic{width:18px;text-align:center;flex-shrink:0}
main{flex:1;padding:22px 28px 48px;min-width:0}
h2{margin:0 0 2px;font-size:22px;font-weight:700}
.desc{color:var(--muted);margin:0 0 16px;max-width:76ch}
.grid{display:grid;gap:14px}
.g6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 10px;font-size:15px}
.card h3 .svg-inline--fa{color:var(--muted);margin-right:4px}
.card-h{display:flex;justify-content:space-between;align-items:start;gap:8px}
.card-h h3{margin-bottom:2px}
.card-h .s{color:var(--muted);font-size:12px;margin-bottom:8px}
/* summary figures sit in one divided strip, like the totals row of a form */
.grid:has(>.stat){display:flex;flex-wrap:wrap;gap:0;background:#fff;border:1px solid var(--line);border-radius:2px}
.grid>.card.stat{flex:1 1 150px;border:0;border-right:1px solid var(--line);border-radius:0;padding:12px 18px}
.grid>.card.stat:last-child{border-right:0}
.stat .n{font-size:26px;font-weight:700;line-height:1.25}
.stat .l{color:var(--muted);font-size:12px}
.stat .d{font-size:12px;margin-top:2px;color:var(--muted)}
.d.up{color:var(--ok)} .d.down{color:var(--shu)}
.chartbox{position:relative;height:260px}
.chartbox.tall{height:320px}
.chartbox.xtall{height:560px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--band);white-space:nowrap}
td.num,th.num{text-align:right}
.tag{display:inline-block;padding:1px 7px;border-radius:2px;font-size:11.5px;background:var(--ai-2);color:var(--ai);white-space:nowrap;border:1px solid transparent}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--shu-bg);color:var(--shu);border-color:#F0C6BD}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.gray{background:#EEF0F3;color:var(--muted)}
.tdot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
form .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
input,select,textarea{width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:3px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ai-2);border-color:var(--ai)}
textarea{min-height:60px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--ai);color:#fff;border:1px solid var(--ai);border-radius:3px;padding:7px 14px;cursor:pointer;font:inherit;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--ai-3)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:#fff;color:var(--ai);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ai)}
.btn.sm{padding:3px 9px;font-size:12px;font-weight:400}
.btn.danger{background:#fff;color:var(--shu);border-color:#E7B8AE}
.btn.link{background:none;color:var(--ai);padding:2px 4px;border:0;font-size:12px;font-weight:400;text-decoration:underline;text-underline-offset:2px}
.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:14px;background:#fff;border:1px solid var(--line);border-radius:2px;padding:10px 14px}
.toolbar>div{min-width:140px}
.seg{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;font:inherit;color:var(--ink)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--ai);color:#fff;font-weight:700}
.range{font-weight:700;padding:7px 4px;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:20px}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.msg{padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--rule);border-radius:2px;margin-bottom:8px;background:#fff}
.msg .meta{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.msg.urgent{border-left-color:var(--shu);background:var(--shu-bg)}
.inv .tot{font-size:22px;font-weight:700;color:var(--ai)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ai);color:#fff;padding:10px 16px;border-radius:3px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(20,30,50,.4);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:3px;border-top:4px solid var(--ai);padding:20px;width:100%;max-width:640px;max-height:90vh;overflow:auto}
.modal h3{margin-top:0}
.scroll{overflow-x:auto}
.tl{max-height:420px;overflow:auto}
/* approval boxes (承認欄) and hanko */
.ck-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:14px;margin:2px 2px 10px}
.ck-head>span:first-child{font-size:13px}
.ck-head>.rt{justify-self:end;display:flex;align-items:end;gap:14px;font-size:13px}
.ck-head h3{margin:0;font-family:var(--mincho);font-size:20px;font-weight:700;letter-spacing:.06em;text-align:center}
.stamps{display:flex;border:1px solid var(--rule)}
.stamps .sb{width:60px;border:0;border-right:1px solid var(--rule);text-align:center;cursor:pointer;background:#fff;padding:0;font:inherit;color:inherit}
.stamps .sb:last-child{border-right:0}
.stamps .sl{display:block;font-size:10.5px;background:var(--head);border-bottom:1px solid var(--rule);padding:2px 0;color:var(--muted)}
.stamps .sv{display:flex;align-items:center;justify-content:center;height:52px}
.stamps .sb:hover .sv{background:var(--band)}
.hanko{width:42px;height:42px;border:2px solid var(--shu);border-radius:50%;color:var(--shu);font-family:var(--mincho);font-weight:700;font-size:13px;line-height:1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);opacity:.93}
.hanko.lat{font-size:8.5px;font-family:var(--sans)}
.hanko i{font-style:normal;font-size:7.5px;font-family:var(--sans);font-weight:400;border-top:1px solid var(--shu);margin-top:2px;padding-top:1px}
@keyframes press{0%{transform:rotate(-8deg) scale(1.4);opacity:0}70%{transform:rotate(-8deg) scale(.96);opacity:1}100%{transform:rotate(-8deg) scale(1);opacity:.93}}
.hanko.new{animation:press .24s ease-out}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0 14px}
.pick .btn{justify-content:flex-start}
@media (prefers-reduced-motion:reduce){.hanko.new{animation:none}.toast{transition:none}}
@media (max-width:820px){
  .wrap{flex-direction:column}
  .brand{width:auto}
  .facility,.shift span{display:none}
  nav{width:auto;height:auto;position:static;display:flex;overflow-x:auto;padding:0}
  nav .grp{display:none}
  nav button{white-space:nowrap;width:auto;border-left:0;border-bottom:3px solid transparent}
  nav button.on{border-bottom-color:var(--shu)}
  main{padding:14px}
  .g2{grid-template-columns:1fr}
  .ck-head{grid-template-columns:1fr}
  .ck-head>.rt{justify-self:start}
}
.wt-wrap{overflow:auto;max-height:640px;border:1px solid var(--rule);border-radius:0;background:#fff}
.wt{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
.wt th,.wt td{border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);padding:0;white-space:nowrap}
.wt th{padding:7px 8px;position:sticky;top:0;z-index:2;text-align:center;background:var(--head);color:#333}
.wt tr:nth-child(odd)>td{background:var(--band)}.wt tr:nth-child(odd)>td.stk{background:var(--band)}
.wt td.c{padding:6px 8px}
.wt .stk{position:sticky;background:#fff;z-index:1}
.wt th.stk{z-index:3;background:var(--head)}
.wt .s0{left:0;min-width:40px;text-align:center}.wt .s1{left:40px;min-width:150px}
.wt input{border:0;border-radius:0;width:64px;text-align:right;padding:6px 6px;background:transparent}
.wt input:focus{outline:2px solid var(--brand);background:#fff}
.wt td.loss{background:var(--bad-bg)}.wt td.gain{background:var(--warn-bg)}
.wt tr.avg td{background:var(--band);font-weight:700}
.wt td.kg{position:relative}.wt td.kg::after{content:"kg";position:absolute;right:3px;bottom:2px;font-size:9px;color:#aaa}

.hr .hc{min-width:44px;text-align:center;padding:4px 2px;cursor:pointer;font-size:11px;line-height:1.35}
.hr .hc:hover{outline:2px solid var(--brand);outline-offset:-2px}
.hr .hc.now{box-shadow:inset 0 0 0 2px var(--brand)}
.hr th.now{background:var(--brand);color:#fff}
.hr .ab{display:inline-block;min-width:16px;padding:0 3px;margin:1px;border-radius:3px;color:#fff;font-weight:700}
.hr td.alertc{background:var(--bad-bg)}
.hr tr.sum td{background:var(--band);font-weight:700;text-align:center}
.hr .night{background:#EDF0F6}

.ck{border-collapse:collapse;font-variant-numeric:tabular-nums;background:#fff}
.ck th,.ck td{border:1px solid var(--rule);padding:2px 4px;white-space:nowrap;font-size:12px}
.ck th{background:var(--head);text-align:center;position:sticky;top:0;z-index:2}
.ck td.h{min-width:34px;text-align:left;cursor:pointer;border-top-style:dashed;border-bottom-style:dashed}
.ck td.h:hover{outline:2px solid var(--brand);outline-offset:-2px}
.ck td.it{font-size:11px;border-top-style:dashed;border-bottom-style:dashed}
.ck td.tot{text-align:center;border-top-style:dashed;border-bottom-style:dashed}
.ck tr.g td{background:#EEF1F5}
.ck .b8{border-left:2px solid #333!important}
.ck td.nm{min-width:130px}
.ck td.low{color:var(--shu);font-weight:700}
.ck .mk{font-weight:700}
.ck .ic{color:var(--bad)}
.ck th.now{background:var(--ai);color:#fff}
.ck td.h.now{background:#E6ECF6}
.ck tr.ft td{background:var(--head);font-weight:700;text-align:center;border-top:2px solid #333}
.ck tr.ft+tr.ft td{border-top-width:1px}
.ck tr.ft td:first-child{text-align:left}
.sheet{background:#fff;border:1px solid var(--line);border-radius:2px;padding:14px 16px}
.sheet table:not(.wt):not(.ck){border-collapse:collapse}
.sheet table:not(.wt):not(.ck) th,.sheet table:not(.wt):not(.ck) td{border:1px solid var(--rule);padding:5px 8px;font-size:12.5px}
.sheet table:not(.wt):not(.ck) th{background:var(--head);text-align:center;color:#333;font-weight:700}
.sheet table:not(.wt):not(.ck) tr:nth-child(odd):not(:first-child)>td{background:var(--band)}
.sheet .tl{max-height:460px;overflow:auto}
.legend-sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin:0 4px 0 12px;border:1px solid var(--line)}

@media (max-width:760px){
  .wrap{flex-direction:column}
  nav{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  nav button{white-space:nowrap;width:auto}
  main{padding:14px}
  header .sub{display:none}
  .g2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><i class="fa-solid fa-hand-holding-heart" aria-hidden="true"></i><div><b>CareBridge</b><small data-i18n="tagline"></small></div></div>
  <div class="facility"><b data-i18n="facility"></b><span id="today"></span><span class="demo" data-i18n="demo"></span></div>

  <div class="lang"><button data-lang="en">EN</button><button data-lang="ja">日本語</button></div>
</header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d);};
const toMin=s=>{const [h,m]=s.split(":").map(Number);return h*60+m;};
const fromMin=m=>`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes();};
const TODAY=ymd(new Date());
const uid=()=>Math.random().toString(36).slice(2,9);
const yen=n=>"¥"+Math.round(n).toLocaleString();

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const HIST_START=addD(TODAY,-365);
const genRec=new Map(), genAtt=new Map();
(function generate(){
  const R=rng(20261126);
  const base={};
  BASE_RES.forEach((r,i)=>base[r.id]={temp:36.3+R()*.3,bps:118+R()*28,bpd:70+R()*12,pulse:66+R()*14,spo2:95.5+R()*2,meal:62+R()*30});
  const nm=nowMin();
  for(let d=HIST_START; d<=TODAY; d=addD(d,1)){
    const dow=(parse(d).getDay()+6)%7, isToday=d===TODAY;
    // staff attendance
    const att=[];
    BASE_STAFF.forEach((s,i)=>{
      if(OFF[s.id].includes(dow)) return; // two days off per week
      const [st,en]=SHIFTS[s.shift];
      const inM=st-10+Math.floor(R()*18), outM=en+Math.floor(R()*35);
      if(isToday && nm<inM) return;
      att.push({sid:s.id,shift:s.shift,in:fromMin(inM),out:(isToday&&nm<outM)?null:fromMin(outM%1440)});
    });
    genAtt.set(d,att);
    const working=att.map(a=>a.sid);
    const pick=(min)=>{const c=BASE_STAFF.filter(s=>{if(!working.includes(s.id))return false;const [a,b]=SHIFTS[s.shift];return (min>=a&&min<b)||(b>1440&&min<b-1440);});const pool=c.length?c:BASE_STAFF.filter(s=>working.includes(s.id));return (pool[Math.floor(R()*pool.length)]||BASE_STAFF[0]).id;};
    const recs=[]; let k=0;
    const push=(rid,min,type,v,memo="",share=false)=>{ if(isToday&&min>nm) return; recs.push({id:`g-${d}-${rid}-${k++}`,rid,date:d,time:fromMin(min),type,v,memo,share,by:pick(min)}); };
    BASE_RES.forEach((r,ri)=>{
      if(r.svc==="svc_day" && !(r.days||[0,2,4]).includes(dow)) return;
      const b=base[r.id]; const season=Math.cos((parse(d).getMonth()-0)/12*2*Math.PI)*4;
      const fever=R()<.03, spike=R()<.035, low=R()<.025;
      const day=r.svc==="svc_day";
      const vt=(day?570:450)+Math.floor(R()*30);
      push(r.id,vt,"vital",{temp:+(b.temp+(R()-.5)*.4+(fever?1.3:0)).toFixed(1),bps:Math.round(b.bps+season+(R()-.5)*14+(spike?28:0)),bpd:Math.round(b.bpd+(R()-.5)*8+(spike?10:0)),pulse:Math.round(b.pulse+(R()-.5)*12+(fever?14:0)),spo2:Math.round(b.spo2+(R()-.5)*2-(low?4:0))});
      const mealTimes=day?[720]:[480,720,1080];
      mealTimes.forEach(mt=>{const a=Math.max(0,Math.min(100,Math.round((b.meal+(R()-.5)*30-(fever?25:0))/10)*10));push(r.id,mt+Math.floor(R()*20),"meal",{amt:a,water:100+Math.round(R()*15)*10},"",mt===720&&R()<.25);});
      (day?[600,780]:[60,240,420,600,720,900,1080,1260]).forEach(et=>{const g=R()<.25;push(r.id,et+Math.floor(R()*40),"excretion",{u:R()<.85?1:0,s:R()<.14?1:0,g,i:!g&&R()<.07});});
      (day?[600,900]:[600,900,1170]).forEach(ft=>push(r.id,ft+Math.floor(R()*15),"fluid",{ml:[100,100,150,150,200][Math.floor(R()*5)]}));
      if(day? R()<.5 : (Math.floor((parse(d)-parse(HIST_START))/864e5)+ri)%3===0) push(r.id,840+Math.floor(R()*60),"bath",{bath:["full","shower","wipe"][Math.floor(R()*3)]},"",R()<.3);
      push(r.id,(day?735:510)+Math.floor(R()*10),"med",{name:["Amlodipine","Magnesium oxide","Donepezil","Vitamin D"][ri%4],given:R()>.02});
      if(R()<.15){const n=lang==="ja"?0:0;const notes=["Joined recreation, smiling / レクリエーションに参加、笑顔あり","Talked with family on phone / ご家族と電話で会話","Slept well / よく眠れていた","Walked in garden / 庭を散歩","Seemed tired, rested in room / 疲れた様子、居室で休息"];push(r.id,960+Math.floor(R()*60),"note",{},notes[Math.floor(R()*notes.length)],true);}
    });
    genRec.set(d,recs);
  }
})();

function rangeOf(period,anchor){
  const d=parse(anchor);
  if(period==="day") return {from:anchor,to:anchor};
  if(period==="week"){const dow=(d.getDay()+6)%7;const f=addD(anchor,-dow);return {from:f,to:addD(f,6)};}
  if(period==="month"){const f=ymd(new Date(d.getFullYear(),d.getMonth(),1));return {from:f,to:ymd(new Date(d.getFullYear(),d.getMonth()+1,0))};}
  return {from:`${d.getFullYear()}-01-01`,to:`${d.getFullYear()}-12-31`};
}
function shiftAnchor(period,anchor,dir){
  const d=parse(anchor);
  if(period==="day") return addD(anchor,dir);
  if(period==="week") return addD(anchor,7*dir);
  if(period==="month") return ymd(new Date(d.getFullYear(),d.getMonth()+dir,Math.min(d.getDate(),28)));
  return ymd(new Date(d.getFullYear()+dir,d.getMonth(),Math.min(d.getDate(),28)));
}
function rangeLabel(period,rg){
  const d=parse(rg.from);
  if(period==="day") return lang==="ja"?`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${T.ja.days_short[(d.getDay()+6)%7]}）`:`${T.en.days_short[(d.getDay()+6)%7]} ${rg.from}`;
  if(period==="week") return `${rg.from} – ${rg.to}`;
  if(period==="month") return lang==="ja"?`${d.getFullYear()}年${d.getMonth()+1}月`:`${T.en.months_short[d.getMonth()]} ${d.getFullYear()}`;
  return lang==="ja"?`${d.getFullYear()}年`:`${d.getFullYear()}`;
}
/* buckets: returns {labels, keyOf(rec or date+time)} */
function buckets(period,rg){
  if(period==="day"){return {unit:t("b_hour"),labels:[...Array(24)].map((_,h)=>`${pad(h)}:00`),key:(date,time)=>+time.slice(0,2)};}
  if(period==="year"){return {unit:t("b_month"),labels:T[lang].months_short.slice(),key:(date)=>+date.slice(5,7)-1};}
  const days=[];for(let d=rg.from;d<=rg.to;d=addD(d,1))days.push(d);
  return {unit:t("b_day"),labels:days.map(d=>{const x=parse(d);return period==="week"?`${T[lang].days_short[(x.getDay()+6)%7]} ${x.getMonth()+1}/${x.getDate()}`:`${x.getDate()}`;}),key:(date)=>days.indexOf(date)};
}

}

  $("#dRes").onchange=e=>{S.dRes=e.target.value;render();};
  $("#dStaff").onchange=e=>{S.dStaff=e.target.value;render();};
  const rg=rangeOf(S.period,S.anchor), b=buckets(S.period,rg), cur=stats(rg), recs=cur.recs, N=b.labels.length;
  // trend stacked
  const byType={};TYPES.forEach(ty=>byType[ty]=Array(N).fill(0));
  const tempS=Array(N).fill(0),tempC=Array(N).fill(0),bpsS=Array(N).fill(0),bpdS=Array(N).fill(0),bpC=Array(N).fill(0),spS=Array(N).fill(0),spC=Array(N).fill(0);

  mkChart("cTemp",{type:"line",data:{labels:b.labels,datasets:[lineDS(t("temp"),avg(tempS,tempC),PAL[0])]},options:lineOpts({y:{suggestedMin:36,suggestedMax:37.5}})});

  mkChart("cBp",{type:"line",data:{labels:b.labels,datasets:[lineDS(t("bp_s"),avg(bpsS,bpC),PAL[0]),lineDS(t("bp_d"),avg(bpdS,bpC),PAL[1])]},options:bpO});

  // meal by resident

      case "med":if(!f.med_name.trim()){toast(t("required"));return;}v={name:f.med_name,given:f.given==="1"};break;
    }
    if(f.type==="note"&&!f.memo.trim()){toast(t("required"));return;}
    db.userRec.push({id:"u-"+uid(),rid:f.rid,date:TODAY,time:f.time||fromMin(nowMin()),type:f.type,v,memo:f.memo,share:!!f.share,by:f.by});

  };
};

function forecast(rid){
  const recs=recsRange(addD(TODAY,-30),TODAY).filter(r=>r.rid===rid);
  const bad=recs.filter(isAlert).length;const m=recs.filter(r=>r.type==="meal");
  const avg=m.length?m.reduce((a,c)=>a+c.v.amt,0)/m.length:80;
  const lv=parseInt(db.res.find(x=>x.id===rid)?.level)||1;
  const sc=(bad>=3?2:bad>=1?1:0)+(avg<60?2:avg<75?1:0)+(lv>=4?1:0);
  return sc>=3?"f_risk":sc>=1?"f_watch":"f_stable";
}

function bill(rid,ym){
  const r=db.res.find(x=>x.id===rid);const [y,m]=ym.split("-").map(Number);

  const days=new Set(recsRange(from,to).filter(z=>z.rid===rid).map(z=>z.date)).size;
  const rate=db.copay[rid]??.1;const units=(UNITS[r.level]||700)*days;const total=units*10;const copay=total*rate;
  return {days,rate,units,total,copay,ins:total-copay};
}

S.ckDate=TODAY; S.ckHide=false; S.ckLow=800;
V.check=()=>{
  const d=S.ckDate, recs=dayRecs(d), x=parse(d);
  const dl=lang==="ja"?`${x.getFullYear()}年${pad(x.getMonth()+1)}月${pad(x.getDate())}日（${T.ja.days_short[(x.getDay()+6)%7]}）`:`${T.en.days_short[(x.getDay()+6)%7]}, ${d}`;

  const by={};recs.forEach(r=>{if(r.type!=="excretion"&&r.type!=="fluid"&&!(r.type==="meal"&&r.v.water))return;const k=r.rid+"|"+(+r.time.slice(0,2));(by[k]=by[k]||[]).push(r);});

      const ex=l.filter(z=>z.type==="excretion").map(z=>excF(z.v));
      if(!ex.length) return `<td class="h ${b8(h)}" data-ck="${r.id}" data-h="${h}"></td>`;
      const val=ex.reduce((a,c)=>a+(row==="s"?c.s:c.u),0);const gd=ex.some(e=>e.g), ic=ex.some(e=>e.i);
      return `<td class="h ${b8(h)}" data-ck="${r.id}" data-h="${h}">${gd?'<span class="mk">✓</span>':""}${ic?'<span class="mk ic">△</span>':""}${val}</td>`;};
    const all=recs.filter(z=>z.rid===r.id);
    const exAll=all.filter(z=>z.type==="excretion").map(z=>excF(z.v));
    const ts=exAll.reduce((a,c)=>a+c.s,0), tu=exAll.reduce((a,c)=>a+c.u,0), tf=all.reduce((a,c)=>a+fluidMl(c),0);

      <tr class="${g}"><td class="it">${t("ck_fluid")}</td><td class="tot ${lowF?"low":""}">${all.length?tf:""}</td>${H.map(h=>cell(h,"f")).join("")}</tr>`;}).join("");
  return `<h2>${t("nav_check")}</h2><p class="desc">${t("ck_d")}</p>

    <div style="min-width:auto"><label>&nbsp;</label><label style="display:flex;gap:6px;align-items:center;color:var(--ink);padding:7px 0"><input type="checkbox" id="kHide" style="width:auto" ${S.ckHide?"checked":""}> ${t("ck_hide")}</label></div>
    <div style="min-width:auto"><label>&nbsp;</label><button class="btn ghost" id="kCsv">${t("copy_csv")}</button></div>
  </div>
  <div class="sheet">
    ${sheetTop(t("ck_title"),t("ck_all",{n:list.length}),dl,"check|"+d)}
    <div class="wt-wrap" style="max-height:680px;border-radius:4px"><table class="ck">

function staffAtHour(d,h){
  const a=h*60,b=a+60; const ids=new Set();
  dayAtt(d).forEach(x=>{const i=toMin(x.in);let o=x.out?toMin(x.out):(d===TODAY?nowMin():1440);if(o<i)o+=1440;if(i<b&&o>a)ids.add(x.sid);});
  if(d>HIST_START) dayAtt(addD(d,-1)).forEach(x=>{if(!x.out)return;const i=toMin(x.in),o=toMin(x.out);if(o<i&&a<o)ids.add(x.sid);});
  return ids.size;
}
const HR_ITEMS=["temp","meal","fluid","exc","oth"];

/* one hour's records -> cell for one item row: "" or {v,red} */
function hourItem(k,l){
  if(!l.length) return "";
  if(k==="temp"){const v=l.filter(r=>r.type==="vital");return v.length?{v:v.map(r=>r.v.temp).join("/"),red:v.some(isAlert)}:"";}
  if(k==="meal"){const v=l.filter(r=>r.type==="meal");return v.length?{v:v.map(r=>r.v.amt).join("/"),red:v.some(isAlert)}:"";}
  if(k==="fluid"){const v=l.reduce((a,c)=>a+fluidMl(c),0);return v?{v}:"";}
  if(k==="exc"){const e=l.filter(r=>r.type==="excretion").map(r=>excF(r.v));if(!e.length)return "";
    const u=e.some(x=>x.u),s=e.some(x=>x.s),g=e.some(x=>x.g),i=e.some(x=>x.i);
    return {v:(g?"✓":"")+(i?"△":"")+(u&&s?t("ab_both"):u?t("ab_urine"):s?t("ab_stool"):"0"),red:i};}
  const o=l.filter(r=>r.type==="bath"||r.type==="med"||r.type==="note");
  return o.length?{v:o.map(r=>t("ab_"+r.type)).join(""),red:o.some(isAlert)}:"";
}
/* whole day -> total column for one item row */
function hourTot(k,rr,r,d){
  if(!rr.length) return "";
  if(k==="temp"){const v=rr.filter(z=>z.type==="vital").map(z=>+z.v.temp);return v.length?{v:Math.max(...v).toFixed(1),red:v.some(x=>x>=37.5)}:"";}
  if(k==="meal"){const v=rr.filter(z=>z.type==="meal").map(z=>+z.v.amt);return v.length?{v:Math.round(v.reduce((a,c)=>a+c,0)/v.length)}:"";}
  if(k==="fluid"){const tf=rr.reduce((a,c)=>a+fluidMl(c),0);const low=r.svc!=="svc_day"&&tf<S.ckLow&&(d<TODAY||new Date().getHours()>=20);return {v:tf,red:low};}
  if(k==="exc"){const e=rr.filter(z=>z.type==="excretion").map(z=>excF(z.v));return e.length?{v:`${t("ab_urine")}${e.reduce((a,c)=>a+c.u,0)} ${t("ab_stool")}${e.reduce((a,c)=>a+c.s,0)}`}:"";}
  const n=rr.filter(z=>z.type==="bath"||z.type==="med"||z.type==="note").length;return n?{v:n}:"";
}

(function(){const R=rng(888);BASE_RES.forEach((r,i)=>{const base=(17.5+R()*8.5)*(r.ht/100)**2, drift=(R()-.6)*.12;let w=base;

const fnameSafe=s=>s.replace(/[\\/:*?"<>|]/g,"-");
let excelLib=null;
function loadExcel(){
  if(window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if(excelLib) return excelLib;
  const urls=["https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js","https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"];
  excelLib=new Promise((res,rej)=>{let i=0;const next=()=>{if(i>=urls.length){excelLib=null;rej(new Error("lib"));return;}
    const s=document.createElement("script");s.src=urls[i++];s.onload=()=>window.ExcelJS?res(window.ExcelJS):next();s.onerror=next;document.head.appendChild(s);};next();});

async function buildXlsx(sheets){
  const X=await loadExcel();
  const wb=new X.Workbook(); wb.creator="CareBridge Demo"; wb.created=new Date();
  const font={name:lang==="ja"?"Meiryo UI":"Calibri",size:10};
  const thin={style:"thin",color:{argb:"FF9AA19E"}}, thick={style:"medium",color:{argb:"FF333333"}};
  const used=new Set();
  for(const sp of sheets){
    let nm=fnameSafe(sp.name).replace(/[\[\]]/g,"").slice(0,31)||"Sheet"; let k=2; while(used.has(nm)) nm=nm.slice(0,28)+"-"+(k++); used.add(nm);
    const ws=wb.addWorksheet(nm,{pageSetup:{orientation:"landscape",paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:.3,right:.3,top:.4,bottom:.4,header:.2,footer:.2}}});
    const nC=sp.cols.length; ws.columns=sp.cols.map(w=>({width:w}));
    ws.mergeCells(1,1,1,nC); const tc=ws.getCell(1,1); tc.value=sp.title; tc.font={...font,size:15,bold:true}; tc.alignment={horizontal:"center",vertical:"middle"}; ws.getRow(1).height=24;
    const half=Math.max(1,Math.floor(nC/2));
    if(nC>1){ ws.mergeCells(2,1,2,half); ws.mergeCells(2,half+1,2,nC); }
    const lc=ws.getCell(2,1); lc.value=sp.left||""; lc.font=font;
    if(nC>1){ const rc=ws.getCell(2,half+1); rc.value=sp.right||""; rc.font=font; rc.alignment={horizontal:"right"}; }
    const top=4, hN=sp.head.length, rows=[...sp.head,...sp.body];
    rows.forEach((row,ri)=>{
      const isHead=ri<hN, bi=ri-hN;
      const band=!isHead&&sp.band>0&&Math.floor(bi/sp.band)%2===1;
      for(let ci=0;ci<nC;ci++){
        const cell=ws.getCell(top+ri,ci+1), raw=row[ci];
        if(raw!==null&&raw!==undefined){
          const o=(typeof raw==="object")?raw:{v:raw};
          cell.value=(o.v===undefined||o.v===null)?"":o.v;
          const f={...font}; if(isHead||o.bold) f.bold=true; if(o.red) f.color={argb:"FFB42318"}; if(o.warn) f.color={argb:"FFB54708"}; cell.font=f;
          const num=typeof cell.value==="number";
          cell.alignment={vertical:"middle",wrapText:!!o.wrap,horizontal:(isHead||(ci===0&&sp.head[0][0]==="No"))?"center":(sp.center&&ci>=sp.freezeX)?"center":num?"right":"left"};
          if(o.fmt) cell.numFmt=o.fmt;
          if(o.fill) cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:o.fill}};
        }
        if(isHead) cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFE9ECEA"}};
        else if(band&&!(raw&&raw.fill)) cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFEDEDED"}};
        cell.border={top:thin,bottom:thin,right:thin,left:(sp.thick||[]).includes(ci)?thick:thin};
      }
    });
    (sp.merges||[]).forEach(([r1,c1,r2,c2])=>{try{ws.mergeCells(top+r1,c1+1,top+r2,c2+1);}catch(e){}});
    if(sp.note){ const nr=top+rows.length+1; ws.mergeCells(nr,1,nr,nC); const c=ws.getCell(nr,1); c.value=sp.note; c.font={...font,color:{argb:"FF555555"}}; c.alignment={horizontal:"right"}; }
    ws.views=[{state:"frozen",xSplit:sp.freezeX||0,ySplit:top-1+hN}];
  }
  return wb.xlsx.writeBuffer();
}

async function runExport(btn){
  const key=view, fn=EXPORTS[key]; if(!fn) return;
  const label=btn.innerHTML; btn.disabled=true; btn.textContent=t("exporting");
  try{
    const spec=fn();
    const buf=await buildXlsx(spec.sheets);
    const data=new Uint8Array(buf);
    const dl=await getDownloads();
    if(dl){
      try{ const r=await dl.save({filename:fnameSafe(spec.file),data}); if(r&&r.status!=="delivered") toast(t("exp_saved")); }
      catch(e){ const c=e&&e.code; toast(c==="declined"?t("exp_declined"):c==="rate_limited"?t("exp_busy"):c==="host_unavailable"?t("exp_host"):t("exp_fail",{m:c||e.message||""})); }
    }else{
      const url=URL.createObjectURL(new Blob([data],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
      const a=document.createElement("a");a.href=url;a.download=fnameSafe(spec.file);document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
      toast(t("exp_saved"));
    }
  }catch(e){ toast(e&&e.message==="lib"?t("exp_lib"):t("exp_fail",{m:e&&e.message||""})); console.error(e); }
  finally{ btn.disabled=false; btn.innerHTML=label; }
}

EXPORTS.daily=()=>{
  const d=S.daily,recs=dayRecs(d),att=dayAtt(d);
  const sRows=db.staff.map(s=>{const a=att.find(z=>z.sid===s.id);let st;if(!a)st=d===TODAY&&nowMin()<SHIFTS[s.shift][0]?"st_wait":"st_off";else if(!a.out)st="st_on";else st="st_done";
    return [staffName(s.id),t(s.role),t("sh_"+s.shift),a?.in||"",a?.out||"",a?{v:+attHours(a,d).toFixed(1),fmt:"0.0"}:"",recs.filter(r=>r.by===s.id).length,t(st)];});
  const rRows=db.res.map(r=>{const rr=recs.filter(z=>z.rid===r.id);if(!rr.length)return [r.room,rname(r.id),"","","","","","","","","",""];
    const v=rr.filter(z=>z.type==="vital").pop(),m=rr.filter(z=>z.type==="meal"),fl=v?vitalFlags(v.v):[],meds=rr.filter(z=>z.type==="med");
    return [r.room,rname(r.id),v?{v:v.v.temp,red:v.v.temp>=37.5}:"",v?`${v.v.bps}/${v.v.bpd}`:"",v?v.v.spo2:"",m.length,m.length?{v:Math.round(m.reduce((a,c)=>a+c.v.amt,0)/m.length)/100,fmt:"0%"}:"",
      rr.reduce((a,c)=>a+fluidMl(c),0),rr.filter(z=>z.type==="excretion").length,rr.some(z=>z.type==="bath")?"✔":"",meds.length?(meds.every(z=>z.v.given)?"✔":"✗"):"",fl.length?{v:fl.join(", "),red:true}:"OK"];});
  const tl=recs.slice().sort((a,b)=>a.time.localeCompare(b.time)).map(r=>[r.time,rname(r.rid),t(r.type),{v:plain(recSummary(r)),red:isAlert(r)},r.memo||"",staffName(r.by)]);
  return {file:fileName("daily-report","介護日報",d),sheets:[
    {name:t("staff_duty"),title:`${t("daily_title")} — ${t("staff_duty")}`,left:`${t("k_staff")}: ${att.length} / ${db.staff.length}`,right:fmtDay(d),cols:[20,14,14,9,9,8,8,10],
      head:[[t("staff"),t("role"),t("shift"),t("clock_in"),t("clock_out"),t("hours"),t("records"),t("status")]],body:sRows,band:1,freezeX:1},
    {name:t("res_summary"),title:`${t("daily_title")} — ${t("res_summary")}`,left:t("ck_all",{n:db.res.length}),right:fmtDay(d),cols:[7,18,8,10,7,7,9,9,9,6,6,26],
      head:[[t("room"),t("resident"),lang==="ja"?"体温":"Temp","BP","SpO2",t("meals"),t("meal_avg"),t("fluid")+" ml",t("exc_n"),t("baths"),t("meds"),t("status")]],body:rRows,band:1,freezeX:2},
    {name:t("timeline"),title:`${t("daily_title")} — ${t("timeline")}`,left:t("count_n",{n:tl.length}),right:fmtDay(d),cols:[8,18,12,44,40,18],
      head:[[t("time"),t("resident"),t("type"),t("detail"),t("memo"),t("by")]],body:tl,band:1,freezeX:1}]};
};
/* 介護記録一覧 */
EXPORTS.rec=()=>{
  let list=recsRange(S.rFrom<HIST_START?HIST_START:S.rFrom,S.rTo);
  if(S.rRes) list=list.filter(r=>r.rid===S.rRes); if(S.rType) list=list.filter(r=>r.type===S.rType); if(S.rStaff) list=list.filter(r=>r.by===S.rStaff);
  list.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const body=list.map(r=>{const res=db.res.find(x=>x.id===r.rid);return [r.date,r.time,rname(r.rid),res?.room||"",t(r.type),{v:plain(recSummary(r)),red:isAlert(r)},r.memo||"",staffName(r.by),r.share?"✔":""];});
  return {file:fileName("care-records","介護記録一覧",`${S.rFrom}_${S.rTo}`),sheets:[{name:t("list_rec"),title:t("list_rec"),left:t("count_n",{n:body.length}),right:`${S.rFrom} – ${S.rTo}`,
    cols:[11,7,18,7,11,44,40,18,6],head:[[t("date"),t("time"),t("resident"),t("room"),t("type"),t("detail"),t("memo"),t("by"),t("share_lbl")]],body,band:1,freezeX:3}]};
};
EXPORTS.res=()=>({file:fileName("residents","利用者一覧",TODAY),sheets:[{name:t("list_res"),title:t("list_res"),left:t("ck_all",{n:db.res.length}),right:fmtDay(TODAY),cols:[5,8,18,18,10,20,8,12,26],
  head:[["No",t("room"),t("name_en"),t("name_ja"),t("level"),t("service"),lang==="ja"?"身長":"Height",t("dob"),t("family")]],
  body:db.res.map((r,i)=>[i+1,r.room,r.en,r.ja,levelLabel(r.level),t(r.svc),r.ht||"",r.dob,r.fam]),band:1,freezeX:3}]});
EXPORTS.staff=()=>{const rg=rangeOf("month",TODAY),recs=recsRange(rg.from,TODAY);
  const body=db.staff.map((s,i)=>{let days=0,h=0;for(let d=rg.from;d<=TODAY;d=addD(d,1)){const a=dayAtt(d).find(z=>z.sid===s.id);if(a){days++;h+=attHours(a,d);}}
    return [i+1,s.en,s.ja,t(s.role),t("sh_"+s.shift),s.phone,days,{v:+h.toFixed(1),fmt:"0.0"},recs.filter(r=>r.by===s.id).length];});
  return {file:fileName("staff","職員一覧",TODAY.slice(0,7)),sheets:[{name:t("list_staff"),title:t("list_staff"),left:t("staff_n",{n:db.staff.length}),right:`${rg.from} – ${TODAY}`,cols:[5,18,14,14,14,15,10,10,10],
    head:[["No",t("name_en"),t("name_ja"),t("role"),t("shift"),t("phone"),t("days_worked"),t("hours"),t("records")]],body,band:1,freezeX:3}]};};
EXPORTS.plan=()=>({file:fileName("care-plans","ケアプラン一覧",TODAY),sheets:[{name:t("list_plan"),title:t("list_plan"),left:t("ck_all",{n:db.res.length}),right:fmtDay(TODAY),cols:[5,18,10,40,40,32,12,14],
  head:[["No",t("resident"),t("level"),t("long_goal"),t("short_goal"),t("services"),t("review"),t("forecast")]],
  body:db.res.map((r,i)=>{const p=db.plans[r.id]||{},f=forecast(r.id);return [i+1,rname(r.id),levelLabel(r.level),{v:p.long||"",wrap:true},{v:p.short||"",wrap:true},{v:p.svc||"",wrap:true},p.review||"",{v:t(f),red:f==="f_risk",warn:f==="f_watch"}];}),band:1,freezeX:2}]});
EXPORTS.bill=()=>{const ym=S.billMonth;let sT=0,sC=0;
  const body=db.res.map((r,i)=>{const b=bill(r.id,ym);sT+=b.total;sC+=b.copay;return [i+1,rname(r.id),levelLabel(r.level),b.days,b.units,{v:b.total,fmt:"¥#,##0"},{v:b.rate,fmt:"0%"},{v:Math.round(b.ins),fmt:"¥#,##0"},{v:Math.round(b.copay),fmt:"¥#,##0",bold:true}];});
  body.push(["",{v:t("ck_total"),bold:true},"","","",{v:sT,fmt:"¥#,##0",bold:true},"",{v:Math.round(sT-sC),fmt:"¥#,##0",bold:true},{v:Math.round(sC),fmt:"¥#,##0",bold:true}]);
  return {file:fileName("billing","介護報酬請求一覧",ym),sheets:[{name:t("list_bill"),title:`${t("list_bill")} (${ym})`,left:t("ck_all",{n:db.res.length}),right:ym,cols:[5,18,10,9,10,13,9,13,13],
    head:[["No",t("resident"),t("level"),t("days"),t("units"),t("total"),t("copay_rate"),t("ins_paid"),t("copay")]],body,band:1,freezeX:2,note:t("bill_note")}]};};
EXPORTS.msg=()=>({file:fileName("staff-messages","職員連絡一覧",TODAY),sheets:[{name:t("list_msg"),title:t("list_msg"),left:t("count_n",{n:db.msgs.length}),right:fmtDay(TODAY),cols:[17,18,8,80],
  head:[[t("date"),t("by"),t("urgent"),t("memo")]],body:[...db.msgs].reverse().map(m=>[m.at,staffName(m.by),m.urgent?{v:"●",red:true}:"",{v:m.text,wrap:true}]),band:1,freezeX:1}]});
/* Dashboard: summary + every chart's data */
EXPORTS.dash=()=>{
  const rg=rangeOf(S.period,S.anchor),cur=stats(rg);
  const sum=[[t("k_rec"),cur.n],[t("k_alert"),{v:cur.alerts,red:cur.alerts>0}],[t("k_meal"),cur.meal==null?"":{v:cur.meal/100,fmt:"0.0%"}],[t("k_bath"),cur.baths],[t("k_hours"),{v:+cur.hours.toFixed(1),fmt:"0.0"}],[t("k_res"),`${cur.res} / ${db.res.length}`],
    [t("resident"),S.dRes?rname(S.dRes):t("all")],[t("staff"),S.dStaff?staffName(S.dStaff):t("all")]];
  const right=rangeLabel(S.period,rg);
  const sheets=[{name:t("summary"),title:`${t("nav_dash")} — ${t("summary")}`,left:`${t("period")}: ${t("p_"+S.period)}`,right,cols:[28,20],head:[[t("metric"),t("value")]],body:sum,band:1,freezeX:1}];
  Object.entries(charts).forEach(([id,c])=>{const {labels,datasets}=c.config.data;
    sheets.push({name:CHART_TITLES[id]||id,title:CHART_TITLES[id]||id,left:`${t("period")}: ${t("p_"+S.period)}`,right,cols:[22,...datasets.map(()=>14)],
      head:[["",...datasets.map(d=>plain(d.label))]],body:labels.map((l,i)=>[plain(l),...datasets.map(d=>d.data[i]==null?"":+(+d.data[i]).toFixed(1))]),band:1,freezeX:1});});
  return {file:fileName("dashboard","ダッシュボード",`${S.period}_${rg.from}`),sheets};
};

/* =================== render =================== */
function render(){
  destroyCharts();
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.lang===lang));
  $("#nav").innerHTML=NAV.map(([g,ks])=>(g?`<div class="grp">${t(g)}</div>`:"")+ks.map(k=>`<button class="${k===view?"on":""}" data-v="${k}" ${k===view?'aria-current="page"':""}><span class="ic"><i class="fa-solid fa-${ICON[k]}" aria-hidden="true"></i></span>${t("nav_"+k)}</button>`).join("")).join("");
  $("#today").textContent=fmtDay(TODAY);
  $("#shift").innerHTML=`<i class="fa-solid fa-user-nurse" aria-hidden="true"></i><span>${t("on_duty_now")}</span><b>${t("ppl",{n:staffAtHour(TODAY,new Date().getHours())})}</b>`;
  $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{view=b.dataset.v;try{history.replaceState(null,"","#"+view);}catch(e){}render();window.scrollTo(0,0);});
  const scrollY=window.scrollY;
  $("#main").innerHTML=V[view]();
  if(V[view].after)V[view].after();
  bindTableToggles();
  addExportButton();
  bindStamps();
  if(view!=="iot")window.scrollTo(0,scrollY);
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem(KEY+"-lang",lang);}catch(e){}render();});
try{lang=localStorage.getItem(KEY+"-lang")||"en";}catch(e){}
const h0=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h0))view=h0;
window.addEventListener("hashchange",()=>{const k=location.hash.slice(1);if(VIEWS.some(v=>v[0]===k)&&k!==view){view=k;render();}});
render();
</script>
